<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Lista de perros</title>
    <script src="index.js" defer></script>
  </head>
  <body>
    <h1>¿Te gusta este perro?</h1>
    <div id="fotoPrincipalContainer">
        <div class="loader" id="spinner"></div>
        <div id="mensajeError" class="escondido" style="text-align:center; padding: 1.5rem; color: #b91c1c;">
          <p style="font-size: 2rem; margin: 0;">⚠️</p>
          <p><strong>Error al cargar la foto del perro</strong></p>
          <p style="font-size: 0.9rem; color: #4b5563;">La API no respondió a tiempo. Intenta saltear o recargar.</p>
        </div>
        <img src="" alt="Perrito lindo" id="perroActual" />
    </div>
    <div id="botonesContainer">
      <button id="like">👍🏻</button>
      <button id="saltear">Saltear</button>
      <button id="dislike">👎🏻</button>
    </div>
    <div class="perrosContainer" id="perrosLikeContainer"></div>
    <div class="perrosContainer" id="perrosDislikeContainer"></div>
  </body>
</html>
