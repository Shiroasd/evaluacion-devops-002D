<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Lista de perros</title>
    <script src="index.js" defer></script>
  </head>
  <body>
    <h1>¿Te gusta este perro?</h1>
    <main class="tarjeta-perro">
      <div id="fotoPrincipalContainer">
        <div class="loader" id="spinner"></div>
        <div id="mensajeError" class="escondido">
          <p style="font-size: 2rem; margin: 0;">⚠️</p>
          <p><strong>Error al cargar la foto del perro</strong></p>
          <p style="font-size: 0.9rem; color: #4b5563;">La API no respondió a tiempo. Intenta saltear o recargar.</p>
        </div>
        <img src="" alt="Perrito lindo" id="perroActual" />
      </div>
      <div id="botonesContainer">
        <button id="like" class="btn btn-like" title="Me gusta">👍🏻</button>
        <button id="saltear" class="btn btn-saltear" title="Saltear">Saltear ⏭️</button>
        <button id="dislike" class="btn btn-dislike" title="No me gusta">👎🏻</button>
      </div>
    </main>

    <section id="panelContador" class="panel-contador">
      <div class="contador-badge badge-like">
        <span>Perritos que te gustaron:</span>
        <strong id="contadorLikes">0</strong>
      </div>
      <div class="contador-badge badge-dislike">
        <span>No te gustaron:</span>
        <strong id="contadorDislikes">0</strong>
      </div>
    </section>

    <div class="perrosContainer escondido" id="perrosLikeContainer"></div>
    <div class="perrosContainer escondido" id="perrosDislikeContainer"></div>
  </body>
</html>
