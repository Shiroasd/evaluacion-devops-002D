apiVersion: apps/v1
kind: Deployment
metadata:
  name: dog-rating-app
  namespace: microservices-demo
  labels:
    app: dog-rating-app
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dog-rating-app
      version: v1
  template:
    metadata:
      labels:
        app: dog-rating-app
        version: v1
    spec:
      containers:
        - name: http
          image: ghcr.io/shiroasd/evaluacion-devops-002d:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
