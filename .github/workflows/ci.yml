name: CI Pipeline - Validación de Código

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-validate:
    name: Linting y Validación Estática
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar Integridad de Archivos del Proyecto
        run: |
          echo "Verificando estructura básica de archivos..."
          test -f index.html || (echo "Error: index.html no existe" && exit 1)
          test -f style.css || (echo "Error: style.css no existe" && exit 1)
          test -f index.js || (echo "Error: index.js no existe" && exit 1)
          echo "Todos los archivos esenciales están presentes."

      - name: Validar Sintaxis de JavaScript (V8 Engine)
        run: |
          echo "Analizando sintaxis de index.js con Node.js..."
          node --check index.js
          echo "Sintaxis válida: no hay errores léxicos ni de sintaxis."

      - name: Ejecutar Análisis Estático (ESLint)
        run: |
          echo "Ejecutando ESLint para verificar calidad de código en entorno Browser..."
          ESLINT_USE_FLAT_CONFIG=false npx -y eslint@8.57.0 index.js --env browser,es2021 --rule '{"no-undef": "error"}'
          echo "Análisis de ESLint completado sin errores críticos."
