version: 2
updates:
  # ----------------------------------------------------
  # 1. Dependencias del Ecosistema NPM
  # ----------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "security"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ----------------------------------------------------
  # 2. Acciones y Flujos de GitHub Actions
  # ----------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "security"
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
